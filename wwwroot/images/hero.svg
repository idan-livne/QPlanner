<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- board -->
  <rect x="20" y="30" width="480" height="340" rx="18" fill="#ffffff"/>
  <rect x="20" y="30" width="480" height="56" rx="18" fill="#17324d"/>
  <rect x="20" y="66" width="480" height="20" fill="#17324d"/>
  <circle cx="48" cy="58" r="7" fill="#f2b705"/>
