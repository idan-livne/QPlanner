  <rect x="210" y="168" width="110" height="10" rx="5" fill="#2f4bd8" opacity="0.25"/>
  <rect x="196" y="208" width="140" height="66" rx="10" fill="#e6eafc"/>
  <rect x="210" y="222" width="54" height="14" rx="7" fill="#2f4bd8" opacity="0.5"/>
  <rect x="210" y="246" width="80" height="10" rx="5" fill="#2f4bd8" opacity="0.25"/>

  <!-- done -->
  <rect x="352" y="130" width="130" height="66" rx="10" fill="#dcf3e5"/>
  <polyline points="366,163 374,171 390,153" fill="none" stroke="#1f8a4c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="400" y="158" width="66" height="10" rx="5" fill="#1f8a4c" opacity="0.3"/>
  <rect x="352" y="208" width="130" height="66" rx="10" fill="#dcf3e5"/>
  <polyline points="366,241 374,249 390,231" fill="none" stroke="#1f8a4c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="400" y="236" width="56" height="10" rx="5" fill="#1f8a4c" opacity="0.3"/>
  <rect x="352" y="286" width="130" height="66" rx="10" fill="#dcf3e5"/>
  <polyline points="366,319 374,327 390,309" fill="none" stroke="#1f8a4c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="400" y="314" width="62" height="10" rx="5" fill="#1f8a4c" opacity="0.3"/>

  <!-- calendar badge -->
  <rect x="430" y="6" width="112" height="104" rx="16" fill="#f2b705"/>
  <rect x="430" y="6" width="112" height="32" rx="16" fill="#e0a300"/>
  <rect x="430" y="24" width="112" height="14" fill="#e0a300"/>
  <text x="486" y="29" font-size="13" font-weight="700" fill="#17324d" text-anchor="middle">QUARTER</text>
  <text x="486" y="90" font-size="44" font-weight="800" fill="#17324d" text-anchor="middle">Q4</text>
