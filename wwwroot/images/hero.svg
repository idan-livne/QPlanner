  <circle cx="92" cy="58" r="7" fill="#ffffff" opacity="0.4"/>
  <text x="128" y="64" font-size="18" font-weight="700" fill="#ffffff">Q4 sprint board</text>

  <!-- column titles -->
  <text x="44" y="116" font-size="14" font-weight="700" fill="#5b6472">TO DO</text>
  <text x="200" y="116" font-size="14" font-weight="700" fill="#2f4bd8">IN PROGRESS</text>
  <text x="356" y="116" font-size="14" font-weight="700" fill="#1f8a4c">DONE</text>

  <!-- to do -->
  <rect x="40" y="130" width="140" height="66" rx="10" fill="#eceef2"/>
  <rect x="54" y="144" width="54" height="14" rx="7" fill="#c9ced8"/>
  <rect x="54" y="168" width="110" height="10" rx="5" fill="#c9ced8"/>
  <rect x="40" y="208" width="140" height="66" rx="10" fill="#eceef2"/>
  <rect x="54" y="222" width="54" height="14" rx="7" fill="#c9ced8"/>
  <rect x="54" y="246" width="90" height="10" rx="5" fill="#c9ced8"/>
  <rect x="40" y="286" width="140" height="66" rx="10" fill="#fbe1e3"/>
  <rect x="54" y="300" width="54" height="14" rx="7" fill="#c62f3c" opacity="0.5"/>
  <rect x="54" y="324" width="100" height="10" rx="5" fill="#c62f3c" opacity="0.3"/>

  <!-- in progress -->
  <rect x="196" y="130" width="140" height="66" rx="10" fill="#e6eafc"/>
